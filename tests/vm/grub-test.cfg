serial --unit=0 --speed=115200
terminal_output serial
echo EVA_VM_START
search --no-floppy --file --set=root /boot/grub/grub.cfg
set prefix=($root)/boot/grub
set timeout=-1
set default=0
insmod all_video
loadfont unicode
set gfxmode=1920x1080,auto
terminal_output gfxterm
insmod gfxmenu
insmod png
set theme=($root)/boot/grub/themes/eva-ros/theme.txt
export theme
menuentry 'Ubuntu' --class ubuntu { echo TEST_ONLY_UBUNTU; sleep --interruptible 3; }
menuentry 'Windows Boot Manager' --class windows { echo TEST_ONLY_WINDOWS; sleep --interruptible 3; }
menuentry 'UEFI Firmware Settings' --class uefi { echo TEST_ONLY_UEFI; sleep --interruptible 3; }
submenu 'Advanced options for Ubuntu' --class advanced {
 menuentry 'Ubuntu kernel test' --class ubuntu { echo TEST_ONLY_KERNEL; sleep 3; }
 menuentry 'Ubuntu recovery test' --class ubuntu { echo TEST_ONLY_RECOVERY; sleep 3; }
}
menuentry 'Memory test (memtest86+x64.efi)' --class memtest { echo TEST_ONLY_MEMTEST; sleep 3; }
menuentry 'Memory test (memtest86+x64.efi, serial console)' --class memtest { echo TEST_ONLY_SERIAL; sleep 3; }
menuentry 'Long entry test: additional Ubuntu kernel and recovery options' --class ubuntu { echo TEST_ONLY_LONG; sleep 3; }
menuentry 'Eighth entry for scrolling test' --class memtest { echo TEST_ONLY_EIGHTH; sleep 3; }
