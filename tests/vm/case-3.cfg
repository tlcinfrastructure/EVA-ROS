serial --unit=0 --speed=115200
terminal_output serial
echo EVA_VM_START
search --no-floppy --file --set=root /boot/grub/grub.cfg
set prefix=($root)/boot/grub
set timeout=-1
set default=0
insmod all_video
loadfont unicode
set gfxmode=1920x1080,auto
terminal_output gfxterm
insmod gfxmenu
insmod png
set theme=($root)/boot/grub/themes/eva-ros/theme.txt
export theme
menuentry 'Ubuntu' --class ubuntu { echo TEST_ONLY_UBUNTU; sleep 3; }
menuentry 'Windows Boot Manager' --class windows { echo TEST_ONLY_WINDOWS; sleep 3; }
menuentry 'UEFI Firmware Settings' --class uefi { echo TEST_ONLY_UEFI; sleep 3; }
